<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insequent Trace Viewer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <span class="eyebrow">LLM TRACE</span>
      <h1>Insequent</h1>
    </div>
    <label class="session-picker">
      <span>Session</span>
      <select id="session" aria-label="Session"></select>
    </label>
    <form id="search-form">
      <input id="search" type="search" placeholder="Search inputs, outputs, state…" autocomplete="off">
      <fieldset class="search-fields" aria-label="Search fields">
        <label><input type="checkbox" name="search-field" value="input" checked><span>Input</span></label>
        <label><input type="checkbox" name="search-field" value="thoughts" checked><span>Thoughts</span></label>
        <label><input type="checkbox" name="search-field" value="output" checked><span>Output</span></label>
      </fieldset>
      <button>Search</button>
    </form>
    <div id="stats" class="stats">Loading…</div>
  </header>

  <main>
    <section class="pane timeline-pane">
      <div class="pane-title">
        <div><span>01</span><h2>Timeline</h2></div>
        <div class="timeline-tools">
          <div class="view-switch" role="group" aria-label="Timeline view">
            <button id="view-list" class="view-switch-btn active" data-view="list" title="Linear list of events">List</button>
            <button id="view-branches" class="view-switch-btn" data-view="branches" title="Branching graph of the call tree">Branches</button>
          </div>
          <div id="orientation-switch" class="view-switch hidden" role="group" aria-label="Branch orientation">
            <button id="orient-vertical" class="view-switch-btn active" data-orient="vertical" title="Grow downward">↓</button>
            <button id="orient-horizontal" class="view-switch-btn" data-orient="horizontal" title="Grow rightward">→</button>
          </div>
          <label
            class="follow-toggle"
            title="When off, stay on the currently focused item"
          >
            <input id="follow-new-items" type="checkbox">
            <span>Follow</span>
          </label>
          <span id="live-indicator" class="live-indicator">● LIVE</span>
          <button
            id="reset-history"
            class="quiet danger"
            title="Permanently delete the selected call and every older call"
            disabled
          >Clean from here</button>
          <button id="refresh" class="quiet">Refresh</button>
        </div>
      </div>
      <div id="waiting-calls" class="waiting-calls">
        <div class="waiting-calls-head">
          <span>0 waiting / running</span>
        </div>
      </div>
      <div id="search-results" class="search-results hidden"></div>
      <div id="timeline" class="timeline"></div>
      <div id="branch-graph" class="branch-graph hidden"></div>
    </section>

    <div
      id="timeline-resizer"
      class="pane-resizer"
      role="separator"
      aria-label="Resize Timeline"
      aria-orientation="vertical"
      tabindex="0"
    ></div>

    <section class="pane mixed-pane">
      <div class="pane-title">
        <div><span>02</span><h2>Mixed trace</h2></div>
        <div id="mixed-status" class="mixed-legend">Select a call</div>
      </div>
      <pre id="mixed" class="code mixed empty">The current state with marked updates appears here.</pre>
    </section>

    <section class="pane exact-pane">
      <div class="pane-title">
        <div><span>03</span><h2>Exact state</h2></div>
        <div class="exact-tools">
          <div id="lineage" class="lineage">Select an event</div>
          <div class="tabs">
            <button data-tab="state" class="active">I/O</button>
            <button data-tab="parameters">Params</button>
            <button data-tab="raw_response">Raw</button>
            <button data-tab="metadata">Metadata</button>
          </div>
        </div>
      </div>
      <pre id="exact" class="code empty">The complete reconstructed value appears here.</pre>
    </section>

    <section class="pane updates-pane">
      <div class="pane-title">
        <div><span>04</span><h2>Updates</h2></div>
        <div class="mixed-legend">chronological · input / output</div>
      </div>
      <div id="updates" class="updates"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
