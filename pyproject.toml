[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insequent-logger"
version = "0.1.0"
description = "Compact, reconstructable logging for sequential LLM calls"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[tool.setuptools.package-data]
insequent_logger = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

